<!DOCTYPE html>
<html>
<head>
  <title>AI Agent Chat</title>
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }
    #chat {
      border: 1px solid #ddd;
      padding: 10px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .user { color: blue; }
    .agent { color: green; }
  </style>
</head>
<body>

<h2>AI Agent Chat</h2>

<div id="chat"></div>

<input id="input" placeholder="Type message..." style="width:80%">
<button onclick="send()">Send</button>

<script>
  const sessionId = Math.random().toString(36).substring(7);

  async function send() {
    const inputBox = document.getElementById("input");
    const message = inputBox.value;

    if (!message) return;

    appendMessage("You", message, "user");

    const res = await fetch("https://kjq4s1qb-8000.inc1.devtunnels.ms/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        session_id: sessionId
      })
    });

    const data = await res.json();

    appendMessage("Agent", data.reply || data.error, "agent");

    inputBox.value = "";
  }

  function appendMessage(sender, text, cls) {
    const chat = document.getElementById("chat");
    chat.innerHTML += `<p class="${cls}"><b>${sender}:</b> ${text}</p>`;
    chat.scrollTop = chat.scrollHeight;
  }
</script>

</body>
</html>
